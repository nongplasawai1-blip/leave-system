<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบวันลาบุคลากร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* Layout: deep-teal header band carrying the fiscal-year switch and pill tabs; light content canvas with soft cards; leave types coded coral / marigold / sky */
:root{
  --bg:#f3f7f6; --surface:#ffffff; --surface-2:#edf3f2; --line:#dbe5e3;
  --ink:#0f2a2e; --muted:#5a6f72;
  --band:#0b3a3f; --band-2:#11545a; --band-ink:#eafaf6; --band-muted:#a9cfc9;
  --accent:#0f9c7d; --accent-strong:#0a7a61; --accent-ink:#ffffff; --accent-soft:#d3f2e8;
  --sick:#d9466c; --sick-soft:#fde3ea; --vac:#1f84c9; --vac-soft:#dcedfb; --per:#b77300; --per-bar:#eea21b; --per-soft:#fdefd3;
  --danger:#c62a1d; --danger-soft:#fde4e1; --ok:#1d7a3e;
  --shadow:0 1px 2px rgba(15,42,46,.05),0 6px 20px rgba(15,42,46,.06);
  --shadow-lg:0 2px 4px rgba(15,42,46,.06),0 14px 34px rgba(15,42,46,.10);
  --f-display:"Kanit","Sarabun","Leelawadee UI","Tahoma",sans-serif;
  --f-body:"Sarabun","TH Sarabun New","Leelawadee UI","Tahoma",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1416; --surface:#122024; --surface-2:#18292d; --line:#24383c; --ink:#e5f2ef; --muted:#93aba7;
  --band:#08262a; --band-2:#0d3a3f; --band-ink:#e5f7f2; --band-muted:#8fbab3;
  --accent:#36d0a6; --accent-strong:#5ee0bb; --accent-ink:#06241d; --accent-soft:#163b33;
  --sick:#ff8aa6; --sick-soft:#3b1d27; --vac:#6db9f2; --vac-soft:#16304a; --per:#f4c35c; --per-bar:#f4c35c; --per-soft:#3a2e15;
  --danger:#ff8b7d; --danger-soft:#3e1f1b; --ok:#6fd28f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1416; --surface:#122024; --surface-2:#18292d; --line:#24383c; --ink:#e5f2ef; --muted:#93aba7;
  --band:#08262a; --band-2:#0d3a3f; --band-ink:#e5f7f2; --band-muted:#8fbab3;
  --accent:#36d0a6; --accent-strong:#5ee0bb; --accent-ink:#06241d; --accent-soft:#163b33;
  --sick:#ff8aa6; --sick-soft:#3b1d27; --vac:#6db9f2; --vac-soft:#16304a; --per:#f4c35c; --per-bar:#f4c35c; --per-soft:#3a2e15;
  --danger:#ff8b7d; --danger-soft:#3e1f1b; --ok:#6fd28f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.35);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6}
h1,h2,h3{font-weight:500}
.brand h1{font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header band */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;color:var(--band-ink);
  background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0) 0 0/18px 18px,linear-gradient(120deg,var(--band),var(--band-2));
  box-shadow:0 6px 24px rgba(8,38,42,.18)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-block:14px 10px}
.logo{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),#7be3c4);box-shadow:0 4px 14px rgba(15,156,125,.4)}
.logo svg{width:24px;height:24px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 200px}
.brand h1{font-family:var(--f-display);font-size:1.35rem;margin:0;line-height:1.2;letter-spacing:.005em;text-wrap:balance}
.brand small{color:var(--band-muted);font-size:.82rem}
.fy{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:4px 4px 4px 12px}
.fy label{font-size:.78rem;color:var(--band-muted);letter-spacing:.03em}
.fy select{background:rgba(255,255,255,.95);color:#0f2a2e;border:0;font-weight:600;border-radius:9px;padding:6px 10px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:transparent;border:1px solid transparent;color:var(--band-muted);border-radius:999px;padding:7px 16px;font-weight:500;transition:background .15s,color .15s}
nav.tabs button:hover{color:var(--band-ink);background:rgba(255,255,255,.08);border-color:transparent}
nav.tabs button[aria-current="page"]{background:var(--band-ink);color:var(--band);font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.15)}

/* controls */
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;transition:transform .12s,box-shadow .15s,border-color .15s,background .15s}
button:hover{border-color:var(--accent)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-strong));color:var(--accent-ink);border-color:transparent;font-weight:600;box-shadow:0 4px 14px rgba(15,156,125,.28)}
button.primary:hover{box-shadow:0 6px 18px rgba(15,156,125,.38);border-color:transparent}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);background:var(--surface-2);border-color:transparent}
button.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
button.small{padding:5px 12px;font-size:.85rem;border-radius:8px}

/* page */
main{padding-block:24px 56px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-display);font-size:1.35rem;margin:0;text-wrap:balance;letter-spacing:.005em}
h3{font-family:var(--f-display);font-size:1.05rem;margin:0}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.field>label{font-size:.82rem;color:var(--muted);font-weight:500;letter-spacing:.01em}
.field.wide{grid-column:1/-1}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.stat::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:var(--c-soft);opacity:.9}
.stat .lbl{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.stat .lbl i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.stat .val{font-family:var(--f-display);font-size:1.9rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.stat .val small{font-family:var(--f-body);font-size:.85rem;font-weight:400;color:var(--muted);margin-left:4px}
.stat.sick{--c:var(--sick);--c-soft:var(--sick-soft)} .stat.per{--c:var(--per-bar);--c-soft:var(--per-soft)}
.stat.vac{--c:var(--vac);--c-soft:var(--vac-soft)} .stat.all{--c:var(--accent);--c-soft:var(--accent-soft)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:.76rem;color:var(--muted);font-weight:600;letter-spacing:.04em;background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
td.num,th.num{text-align:right}
.name-cell{display:flex;align-items:center;gap:12px;line-height:1.3}
.name-cell .av{width:38px;height:38px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:.95rem;background:var(--accent-soft);color:var(--accent-strong)}
.name-cell .nm{display:flex;flex-direction:column;min-width:0}
.name-cell small{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:.8rem;font-weight:600;white-space:nowrap}
.k-sick{background:var(--sick-soft);color:var(--sick)}
.k-vac{background:var(--vac-soft);color:var(--vac)}
.k-per{background:var(--per-soft);color:var(--per)}
.pill.neutral{background:var(--surface-2);color:var(--muted);font-weight:500}
.pill.warn{background:var(--danger-soft);color:var(--danger)}
.usage{display:flex;flex-direction:column;gap:4px;min-width:120px}
.usage .bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.usage .bar i{display:block;height:100%;border-radius:4px}
.usage .t{font-size:.86rem;font-weight:500}
.usage .cum{font-size:.74rem;color:var(--muted)}
.brk{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.86rem;border-top:1px dashed var(--line);padding-top:10px;font-variant-numeric:tabular-nums}
.brk dt{color:var(--muted)}
.brk dd{margin:0;text-align:right;font-weight:500}
.brk .sum{color:var(--ink);font-weight:600}
.brk .sec{grid-column:1/-1;font-size:.74rem;letter-spacing:.04em;color:var(--muted);font-weight:600;margin-top:4px}
.carry-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.usage.over .t{color:var(--danger);font-weight:700}

/* balance cards */
.balances{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.bal{border:1px solid var(--line);border-radius:var(--r);padding:18px;background:var(--surface);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.bal::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c)}
.bal.sick{--c:var(--sick);--c-soft:var(--sick-soft)} .bal.per{--c:var(--per-bar);--c-soft:var(--per-soft)} .bal.vac{--c:var(--vac);--c-soft:var(--vac-soft)}
.bal .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bal .body{display:flex;align-items:center;gap:18px}
.ring{--p:0;width:92px;height:92px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--c-soft) 0)}
.ring span{width:70px;height:70px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;line-height:1.15}
.ring b{display:block;font-family:var(--f-display);font-size:1.05rem;color:var(--ink)}
.bal .big{font-family:var(--f-display);font-size:2.3rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.bal .big small{display:block;font-size:.85rem;font-weight:400;color:var(--muted);font-family:var(--f-body);margin-top:6px}
.bal .bar{display:none}
.bal .meta{font-size:.84rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:7px 16px;background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:500;transition:all .15s}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line)}
.chip.sick::before{background:var(--sick)} .chip.per::before{background:var(--per-bar)} .chip.vac::before{background:var(--vac)} .chip.plain::before{background:var(--accent)}
.chip:hover{border-color:var(--muted)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked).sick{background:var(--sick-soft);border-color:var(--sick);color:var(--sick)}
.chip:has(input:checked).vac{background:var(--vac-soft);border-color:var(--vac);color:var(--vac)}
.chip:has(input:checked).per{background:var(--per-soft);border-color:var(--per-bar);color:var(--per)}
.chip:has(input:checked).plain{background:var(--accent-soft);border-color:var(--accent)}
.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.notice{border-radius:12px;padding:12px 16px;background:var(--surface-2);font-size:.9rem}
.notice.warn{background:var(--danger-soft);color:var(--danger)}
.notice.ok{background:var(--accent-soft)}
.calc{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;padding:14px 18px;border-radius:12px;background:linear-gradient(120deg,var(--accent-soft),var(--surface-2))}
.calc b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.search-results{border:1px solid var(--line);border-radius:12px;max-height:240px;overflow:auto;background:var(--surface);box-shadow:var(--shadow-lg);margin-top:6px}
.search-results button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}
.search-results button:hover{background:var(--surface-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--band);color:var(--band-ink);padding:12px 20px;border-radius:14px;z-index:20;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg);border-left:4px solid var(--accent)}
.empty{text-align:center;padding:44px 20px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty::before{content:"";width:56px;height:56px;border-radius:16px;margin-bottom:6px;
  background:linear-gradient(135deg,var(--accent-soft),var(--vac-soft))}
.empty h3{color:var(--ink)}
.empty p{max-width:52ch;margin:0}
.legal{font-size:.84rem;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:12px 16px 12px 32px;margin:0}
.legal li{margin-bottom:2px}
.person-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.person-head h2{font-size:1.5rem}
.confirm{display:inline-flex;gap:6px;align-items:center}
.cxl-form{flex-wrap:wrap}.cxl-form input{min-width:200px;padding:5px 8px}
.cxl-range{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;width:100%;font-size:.88rem}
.cxl-range label{display:inline-flex;align-items:center;gap:6px}.cxl-range select{padding:4px 6px}
.cxl-days{color:var(--muted)}.cxl-days.bad{color:var(--danger)}
tr.cancelled td.strike{text-decoration:line-through;color:var(--muted)}
.cxl-note{color:var(--danger)}
.ico{width:16px;height:16px;flex:0 0 auto}
.userbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.userbox .who{display:flex;flex-direction:column;line-height:1.2;text-align:right;margin-right:4px}
.userbox .who small{color:var(--band-muted);font-size:.78rem}
.userbox .hb{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:var(--band-ink);padding:6px 12px;font-size:.85rem;border-radius:999px}
.userbox .hb:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3)}
.login-wrap{display:grid;place-items:center;padding-block:40px}
.login{width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px;padding:28px}
.login-head{display:flex;align-items:center;gap:14px}
.login-head h2{font-size:1.5rem}
.pw{position:relative;display:flex}
.pw input{flex:1;padding-right:70px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
body.busy{cursor:progress}
body.busy main button.primary{opacity:.7;pointer-events:none}
.steps ol{margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.steps li{line-height:1.55}
.pager{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:.92rem}
.pager .ps{display:flex;align-items:center;gap:8px;color:var(--muted)}
.pager .ps select{padding:5px 8px;font-weight:600;color:var(--ink)}
.pg{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pg button{min-width:36px;padding:5px 8px}
.pg button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
td.no,th.no{width:44px;color:var(--muted);text-align:center}
.tdp{position:relative;display:flex;min-width:0}
.tdp input[type=text]{flex:1;min-width:0;padding-right:44px;font-variant-numeric:tabular-nums}
.tdp .tdp-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--accent-strong);padding:6px 8px;border-radius:8px;display:grid;place-items:center}
.tdp .tdp-btn:hover{background:var(--accent-soft)}
.tdp .tdp-btn .ico{width:18px;height:18px}
.cal{position:absolute;top:calc(100% + 6px);left:0;z-index:40;width:300px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:12px}
.cal .cal-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cal .cal-head select{padding:5px 6px;font-size:.88rem;flex:1;min-width:0}
.cal .cal-head button{padding:4px 10px;border-radius:8px}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-variant-numeric:tabular-nums}
.cal .dow{font-size:.72rem;color:var(--muted);padding:4px 0}
.cal .grid button{padding:6px 0;border:0;border-radius:8px;background:transparent;font-size:.88rem}
.cal .grid button:hover{background:var(--surface-2)}
.cal .grid button.we{color:var(--sick)}
.cal .grid button.hol{color:var(--sick);background:var(--sick-soft)}
.cal .grid button.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal .grid button.sel{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cal .cal-foot{display:flex;justify-content:space-between;margin-top:8px;font-size:.78rem;color:var(--muted);align-items:center}
button.icon-btn{display:inline-flex;align-items:center;gap:6px}
.acts{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end}
.acts button{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;font-size:.85rem;border-radius:8px}
.acts .edit{color:var(--vac);border-color:var(--vac-soft);background:var(--vac-soft)}
.acts .del{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.acts .view{color:var(--accent-strong);border-color:var(--accent-soft);background:var(--accent-soft)}
.acts button:hover{filter:brightness(.97);border-color:currentColor}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.toolbar input[type=search]{flex:1 1 220px}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(6,24,27,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;

<script>
(() => {
"use strict";
// ---------- constants & helpers ----------
const KINDS = {

const DEFAULT_CONFIG = {

    emp:  {label:"พนักงานราชการ", sick:30, personal:10, personalFirstYear:10, vacation:10, carryCap:15, carryCapLong:15, longYears:0},

};
const TH_MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseD = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const isoOf = dt => dt.toISOString().slice(0,10);
const thDate = iso => { if(!iso) return "–"; const [y,m,d]=iso.split("-").map(Number); return `${d} ${TH_MONTHS[m-1]} ${y+543}`; };
const fyOf = iso => { const [y,m] = iso.split("-").map(Number); return (m >= 10 ? y+1 : y) + 543; };
const fyRange = fy => [`${fy-544}-10-01`, `${fy-543}-09-30`];
const todayIso = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`; };
const fmtN = n => (Math.round(n*10)/10).toLocaleString("th-TH", {maximumFractionDigits:1});
const initial = n => { const t=String(n||"").replace(/^(นางสาว|นาย|นาง|น\.ส\.|ดร\.|ว่าที่ ?ร\.?ต\.?)\s*/,"").trim(); const m=t.match(/[ก-ฮA-Za-z]/); return m?m[0]:"•"; };
// รายการตั้งต้น ใช้เมื่อชีตไม่มีแท็บ "กลุ่มงาน" (แต่ละหน่วยงานกำหนดเองได้ในแท็บนั้น)
const ORG_DEFAULT = [
  // names match the live staff sheet (บุคลากร) so filters don't split one group into two
  {g:"กลุ่มงานยุทธศาสตร์และแผนงาน", s:["งานพัฒนายุทธศาสตร์","งาน Digital Health & Data"]},
  {g:"กลุ่มงานบริหารทรัพยากรบุคคล", s:[]},
  {g:"งานพัฒนาระบบบริการสุขภาพ", s:[]},
  {g:"กลุ่มงานบริหารการเงินการคลัง", s:[]},
  {g:"กลุ่มงานอำนวยการ", s:["งานบริหารและระบบสารบรรณ","งานการเงินและบัญชี","งานกฎหมายและเสริมสร้างวินัยฯ","งานพัสดุ"]},
];
let ORG = ORG_DEFAULT;
const sectionsOf = g => (ORG.find(o=>o.g===g)||{s:[]}).s;
const groupOptions = sel => { const names=ORG.map(o=>o.g); const extra = sel && !names.includes(sel) ? [sel] : [];
  return [...names, ...extra].map(g=>`<option value="${esc(g)}" ${sel===g?"selected":""}>${esc(g)}${extra.includes(g)?" (ข้อมูลเดิม)":""}</option>`).join(""); };
const LEVELS = [
  ["ประเภทวิชาการ",["ปฏิบัติการ","ชำนาญการ","ชำนาญการพิเศษ","เชี่ยวชาญ","ทรงคุณวุฒิ"]],

const posLine = p => [p.position, p.level ? "ระดับ"+p.level : ""].filter(Boolean).join(" ");
const TH_MONTHS_FULL = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const CAL_ICON = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>';
const isoToBE = iso => { if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}/${m}/${Number(y)+543}`; };
const beToIso = txt => { const m = String(txt||"").trim().match(/^(\d{1,2})[\/\-\. ](\d{1,2})[\/\-\. ](\d{2,4})$/); if(!m) return null;
  let d=+m[1], mo=+m[2], y=+m[3]; if(y<100) y+=2500; if(y>2400) y-=543; if(y<1900||y>2200||mo<1||mo>12||d<1) return null;
  const dt=new Date(Date.UTC(y,mo-1,d)); if(dt.getUTCDate()!==d) return null; return isoOf(dt); };
function dateField(id, iso, opts={}){
  const open = S.tdp && S.tdp.id===id;
  let cal = "";
  if(open){
    const y=S.tdp.y, m=S.tdp.m; const first=new Date(Date.UTC(y,m,1)).getUTCDay(); const n=new Date(Date.UTC(y,m+1,0)).getUTCDate();
    const hs=holidaySet(); const today=todayIso(); let cells="";

}

const groupOf = p => (p.group || p.unit || "").trim();

// ---------- leave math ----------
function holidaySet(){ return new Set((S.config.holidays||[]).map(h=>h.d)); }
function workingDays(start, end, half){
  if(!start || !end || end < start) return 0;
  const hs = holidaySet(); let n = 0;
  for(let d=parseD(start); isoOf(d) <= end; d.setUTCDate(d.getUTCDate()+1)){
    const wd = d.getUTCDay(); if(wd===0||wd===6) continue; if(hs.has(isoOf(d))) continue; n++;
  }
  if(half && half!=="full" && start===end) return n ? 0.5 : 0;
  return n;
}
function typeCfg(p){ return S.config.types[p.ptype] || S.config.types.gov; }
function serviceYearsAt(){ return 0; }
function usedIn(p, fy, kind){ return (p.leaves||[]).filter(l=>l.fy===fy && l.kind===kind).reduce((s,l)=>s+Number(l.days||0),0); }
function vacCap(p, fy){ const c=typeCfg(p); const yrs=serviceYearsAt(p, fyRange(fy)[0]); return (c.longYears>0 && yrs>=c.longYears) ? c.carryCapLong : c.carryCap; }
function carryIn(p, fy, depth=0){
  const carry = p.carry||{};
  if(carry[fy]!=null && carry[fy]!=="") return {v:Number(carry[fy]), manual:true};
  const keys = Object.keys(carry).map(Number);
  const base = Math.min(Number(S.config.startFY)||fy, ...(keys.length?keys:[Infinity]));
  if(fy <= base || depth > 40) return {v:0, manual:false};
  const c = typeCfg(p);
  const prev = vacEntitled(p, fy-1, depth+1) - usedIn(p, fy-1, "vacation");
  return {v:Math.max(0, Math.min(vacCap(p,fy)-c.vacation, prev)), manual:false};
}
function vacEntitled(p, fy, depth=0){ return typeCfg(p).vacation + carryIn(p, fy, depth).v; }
function manualCarry(p, kind, fy){ const v=((p.carryK||{})[kind]||{})[fy]; return (v==null||v==="") ? null : Number(v); }
function cumUsed(p, fy, kind){ const ls=(p.leaves||[]).filter(l=>l.fy<=fy && l.kind===kind); return {days:ls.reduce((s,l)=>s+Number(l.days||0),0), count:ls.length}; }
function balances(p, fy){
  const c = typeCfg(p);
  const ci = carryIn(p, fy);
  const mk = (kind, annual, carry, carryManual) => { const used=usedIn(p,fy,kind); const cu=cumUsed(p,fy,kind); const quota=annual+carry;
    return {annual, carry, carryManual, quota, used, left:quota-used, count:(p.leaves||[]).filter(l=>l.fy===fy && l.kind===kind).length, cum:cu.days, cumCount:cu.count}; };
  const cs = manualCarry(p,"sick",fy), cp = manualCarry(p,"personal",fy);
  const out = {
    sick: mk("sick", c.sick, cs||0, cs!=null),
    personal: mk("personal", c.personal, cp||0, cp!=null),
    vacation: mk("vacation", c.vacation, ci.v, ci.manual),
  };
  out.personal.emergency = (p.leaves||[]).filter(l=>l.fy===fy && l.kind==="personal" && l.emergency).length;
  out.vacation.cap = vacCap(p,fy);
  return out;
}

// ---------- data access ----------
function gas(fn, args){
  return new Promise((res, rej) => {
    if(!(window.google && google.script && google.script.run)){ rej(new Error("เปิดหน้านี้ผ่านลิงก์เว็บแอปของ Google Apps Script")); return; }
    google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e))[fn].apply(null, args);
  });
}
function applyData(d){
  S.me = d.me; S.isHR = !!d.isHR;
  S.config = {...DEFAULT_CONFIG, ...d.config, types: Object.keys(d.config.types||{}).length ? d.config.types : DEFAULT_CONFIG.types};
  ORG = (d.config.org && d.config.org.length) ? d.config.org : ORG_DEFAULT;
  const m = new Map();
  for(const st of d.staff) m.set(st.id, {...st, leaves:[], cancelled:[], carry:{}, carryK:{sick:{}, personal:{}}});
  // รายการที่ยกเลิกแล้วแยกไว้ใน p.cancelled: แสดงในประวัติ แต่ไม่นับเป็นวันลาที่ใช้ไป
  for(const l of d.leaves){ const p=m.get(l.staffId); if(p) (l.cancelled?p.cancelled:p.leaves).push(l); }
  for(const c of d.carry){ const p=m.get(c.staffId); if(!p) continue;
    if(c.vacation!=null) p.carry[c.fy]=c.vacation; if(c.sick!=null) p.carryK.sick[c.fy]=c.sick; if(c.personal!=null) p.carryK.personal[c.fy]=c.personal; }
  S.staff = m; S.staffLoaded = true;
  S.myDoc = m.get(d.me.id) || null;
}
async function call(fn, ...args){
  S.busy = true; document.body.classList.add("busy");
  try{
    const r = await gas(fn, [S.token, ...args]);
    if(r && r.data) applyData(r.data);
    render();
    return r;
  }catch(e){
    const msg = String((e && e.message) || e);
    if(msg.indexOf("SESSION")>=0){ doLogout(true); toast(msg.replace(/^.*SESSION:\s*/,"")); }
    else toast(msg.replace(/^Error:\s*/,""));
    throw e;
  }finally{ S.busy = false; document.body.classList.remove("busy"); }
}
function saveToken(t){ try{ if(t) sessionStorage.setItem("leave.token", t); else sessionStorage.removeItem("leave.token"); }catch(e){} }
function doLogout(silent){
  const t=S.token; S.token=null; saveToken(null); S.staff=new Map(); S.myDoc=null; S.me=null; S.isHR=false; S.view="summary"; S.editStaff=null; S.delStaff=null; S.pwModal=null; S.resetFor=null;
  if(t && !silent) gas("logout",[t]).catch(()=>{});
  render();
}

// ---------- ฟอร์มยกเลิกวันลา: ระบุช่วงวันที่ที่จะยกเลิกได้ (ค่าเริ่มต้น = ทั้งรายการ) ----------
function leaveWorkDates(l){ const hs=holidaySet(), out=[];
  for(let d=parseD(l.start); isoOf(d)<=l.end; d.setUTCDate(d.getUTCDate()+1)){ const wd=d.getUTCDay(), x=isoOf(d); if(wd!==0&&wd!==6&&!hs.has(x)) out.push(x); }
  return out; }
// วันที่ยกเลิก = วันลาเดิม − วันทำการของช่วงที่เหลือ (ตรงกับที่เซิร์ฟเวอร์คำนวณ)
function cxlDays(l, from, to){
  if(from===l.start && to===l.end) return Number(l.days||0);
  const dayBefore=x=>{ const d=parseD(x); d.setUTCDate(d.getUTCDate()-1); return isoOf(d); }, dayAfter=x=>{ const d=parseD(x); d.setUTCDate(d.getUTCDate()+1); return isoOf(d); };
  const keep=(from>l.start?workingDays(l.start, dayBefore(from)):0)+(to<l.end?workingDays(dayAfter(to), l.end):0);
  return Math.max(0, Math.round((Number(l.days||0)-keep)*2)/2);
}
function cxlFormHtml(l){
  const id=esc(l.id), dates=leaveWorkDates(l), multi=l.start!==l.end && dates.length>1;
  const opts=sel=>dates.map(d=>`<option value="${d}" ${d===sel?"selected":""}>${thDate(d)}</option>`).join("");
  const range=multi?`<div class="cxl-range"><label>ยกเลิกตั้งแต่ <select id="cxl_from" aria-label="ยกเลิกตั้งแต่วันที่">${opts(dates[0])}</select></label>
      <label>ถึง <select id="cxl_to" aria-label="ยกเลิกถึงวันที่">${opts(dates[dates.length-1])}</select></label>
      <span class="cxl-days" id="cxl_days">ยกเลิก ${fmtN(l.days)} วันทำการ (ทั้งรายการ)</span></div>`:"";
  return `<form class="confirm cxl-form" id="cxlForm" data-id="${id}">${range}<input id="cxl_reason" maxlength="500" placeholder="เหตุผลการยกเลิก (จำเป็น)" aria-label="เหตุผลการยกเลิกวันลา" required>
      <button type="submit" class="small danger">ยืนยันยกเลิกวันลา</button><button type="button" class="small ghost" data-act="cancel">ปิด</button></form>`;
}
function findLeave(id){ for(const p of S.staff.values()) for(const l of [...(p.leaves||[]), ...(p.cancelled||[])]) if(l.id===id) return l; return null; }
function cxlRead(){
  const f=document.getElementById("cxlForm"); const l=f&&findLeave(f.dataset.id); if(!l) return null;
  const fe=document.getElementById("cxl_from"), te=document.getElementById("cxl_to");
  const from=fe?fe.value:l.start, to=te?te.value:l.end;
  const whole=!fe || (from===leaveWorkDates(l)[0] && to===leaveWorkDates(l).slice(-1)[0]);
  // เลือกตั้งแต่วันทำการแรกถึงวันทำการสุดท้าย = ยกเลิกทั้งรายการ
  return {l, from:whole?l.start:from, to:whole?l.end:to, whole};
}
function cxlUpdate(){
  const r=cxlRead(), el=document.getElementById("cxl_days"); if(!r||!el) return;
  if(r.to<r.from){ el.textContent="วันที่ถึง ต้องไม่ก่อนวันที่ตั้งแต่"; el.classList.add("bad"); return; }
  el.classList.remove("bad");
  el.textContent=`ยกเลิก ${fmtN(cxlDays(r.l, r.from, r.to))} วันทำการ`+(r.whole?" (ทั้งรายการ)":` · คงเหลือเป็นวันลา ${fmtN(Number(r.l.days||0)-cxlDays(r.l, r.from, r.to))} วัน`);
}

function balanceCards(p, fy){
  const b = balances(p, fy);
  const card = (k, extra) => {
    const x=b[k]; const pct = x.quota>0?Math.min(100,x.used/x.quota*100):(x.used?100:0);
    const cls = k==="sick"?"sick":k==="vacation"?"vac":"per";
    return `<div class="bal ${cls}"><div class="head"><span class="pill ${KINDS[k].cls}">${KINDS[k].label}</span><span class="muted" style="font-size:.84rem">${x.count} ครั้ง</span></div>
      <div class="body"><div class="ring" style="--p:${pct.toFixed(1)}"><span><b>${Math.round(pct)}%</b>ใช้ไป</span></div>
      <div class="big" style="color:${x.left<0?"var(--danger)":"inherit"}">${fmtN(x.left)}<small>วันคงเหลือ</small></div></div>
      <dl class="brk"><span class="sec">สิทธิ์การลา</span>
        <dt>ประจำปี</dt><dd>${fmtN(x.annual)} วัน</dd>
        <dt>สะสมยกมา${x.carryManual?" (HR กำหนด)":k==="vacation"?" (อัตโนมัติ)":""}</dt><dd>${fmtN(x.carry)} วัน</dd>
        <dt class="sum">รวมสิทธิ์ปีนี้</dt><dd class="sum">${fmtN(x.quota)} วัน</dd>
        <span class="sec">วันที่ลาไปแล้ว</span>
        <dt>ประจำปี (ปีงบ ${fy})</dt><dd>${fmtN(x.used)} วัน · ${x.count} ครั้ง</dd>
        <dt>สะสมทุกปี (ถึงปีงบ ${fy})</dt><dd>${fmtN(x.cum)} วัน · ${x.cumCount} ครั้ง</dd></dl>${extra||""}</div>`;
  };
  const vacExtra = `<div class="meta"><span>ยอดยกมาอัตโนมัติรวมกับปีนี้ได้ไม่เกิน ${b.vacation.cap} วัน</span></div>`;
  const perExtra = b.personal.emergency?`<div class="meta"><span>ในปีนี้เป็นลากิจฉุกเฉิน ${b.personal.emergency} ครั้ง</span></div>`:"";
  return `<div class="balances">${card("sick")}${card("personal",perExtra)}${card("vacation",vacExtra)}</div>`;
}
function leaveTable(p, fy, editable){
  const ls = [...(p.leaves||[]), ...(p.cancelled||[])].filter(l=>l.fy===fy).sort((a,b)=>b.start.localeCompare(a.start));
  if(!ls.length) return `<div class="panel empty"><h3>ไม่มีรายการลาในปีงบประมาณ ${fy}</h3><p>${editable?"กด “บันทึกการลา” เพื่อเพิ่มรายการ":"เมื่อ HR บันทึกการลาของคุณ รายการจะแสดงที่นี่"}</p></div>`;
  const actions = l => {
    const id=esc(l.id), k=S.confirmKey;
    if(k==="del:"+l.id) return `<span class="confirm"><button class="small danger" data-act="del-leave" data-id="${id}">ยืนยันลบ</button><button class="small ghost" data-act="cancel">ไม่ลบ</button></span>`;
    if(k==="cxl:"+l.id) return cxlFormHtml(l);
    if(k==="rst:"+l.id) return `<span class="confirm"><button class="small primary" data-act="restore-leave" data-id="${id}">ยืนยันคืนสถานะ</button><button class="small ghost" data-act="cancel">ปิด</button></span>`;
    return `<span class="confirm">${l.cancelled
      ?`<button class="small ghost" data-act="ask" data-k="rst:${id}">คืนสถานะ</button>`
      :`<button class="small ghost" data-act="ask" data-k="cxl:${id}">ยกเลิกวันลา</button>`}<button class="small ghost" data-act="ask" data-k="del:${id}">ลบ</button></span>`;
  };
  return `<div class="tbl-wrap"><table><thead><tr><th>ประเภท</th><th>ตั้งแต่</th><th>ถึง</th><th class="num">วันทำการ</th><th>หมายเหตุ</th>${editable?"<th></th>":""}</tr></thead><tbody>
  ${ls.map(l=>{ const K=KINDS[l.kind]||{cls:"neutral",label:esc(l.kind||"?")}; return `<tr${l.cancelled?' class="cancelled"':""}><td><span class="pill ${K.cls}">${K.label}</span>${l.emergency?` <span class="pill warn">ฉุกเฉิน</span>`:""}${l.cancelled?` <span class="pill neutral">ยกเลิกแล้ว</span>`:""}</td>
    <td class="strike">${thDate(l.start)}${l.half&&l.half!=="full"?` <small class="muted">(${l.half==="am"?"ครึ่งเช้า":"ครึ่งบ่าย"})</small>`:""}</td><td class="strike">${thDate(l.end)}</td>
    <td class="num strike">${fmtN(l.days)}</td><td style="white-space:normal;min-width:160px">${esc(l.note||"")}${l.docNo?`<br><small class="muted">เลขที่ ${esc(l.docNo)}</small>`:""}${l.cancelled?`<br><small class="cxl-note">ยกเลิก${l.cancelledAt?" "+thDate(l.cancelledAt):""}${l.cancelledBy?" โดย "+esc(l.cancelledBy):""}: ${esc(l.cancelReason||"-")}</small>`:""}</td>
    ${editable?`<td>${actions(l)}</td>`:""}</tr>`; }).join("")}
  </tbody></table></div>`;
}

const SP = { idx: 0, items: [], quiet: false };
function spNorm(x){ return String(x||"").toLowerCase().replace(/\s+/g," ").trim(); }
function spFilter(q){
  const L = staffList(); q = spNorm(q);
  if(!q) return L;
  const words = q.split(" ");
  return L.filter(s=>{ const t=spNorm(`${s.name} ${s.position||""} ${s.level||""} ${s.group||""} ${s.section||""}`); return words.every(w=>t.includes(w)); });
}
function spHi(text, q){
  const t=String(text||""), w=spNorm(q).split(" ").filter(Boolean).sort((a,b)=>b.length-a.length)[0];
  if(!w) return esc(t); const i=t.toLowerCase().indexOf(w); if(i<0) return esc(t);
  return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+w.length))+"</mark>"+esc(t.slice(i+w.length));
}
function spOpen(q){
  const box=document.getElementById("f_staff_list"), inp=document.getElementById("f_staff_q"); if(!box||!inp) return;
  const all=spFilter(q); SP.items=all.slice(0,60); SP.idx=Math.min(SP.idx, Math.max(0,SP.items.length-1));
  box.innerHTML = SP.items.length
    ? SP.items.map((s,i)=>`<li role="option" id="sp_${i}" data-sp="${esc(s._id)}" aria-selected="${i===SP.idx}"><b>${spHi(s.name,q)}</b><small>${spHi([posLine(s),orgLine(s)].filter(Boolean).join(" · "),q)}</small></li>`).join("")
      + (all.length>SP.items.length?`<li class="sp-more" aria-disabled="true">พบ ${all.length} คน แสดง ${SP.items.length} คนแรก พิมพ์เพิ่มเพื่อค้นหาให้แคบลง</li>`:"")
    : `<li class="sp-none" aria-disabled="true">ไม่พบบุคลากรที่ตรงกับ “${esc(q)}”</li>`;
  box.hidden=false; inp.setAttribute("aria-expanded","true");
  if(SP.items.length) inp.setAttribute("aria-activedescendant","sp_"+SP.idx); else inp.removeAttribute("aria-activedescendant");
  document.getElementById("sp_"+SP.idx)?.scrollIntoView({block:"nearest"});
}
function spClose(){ const box=document.getElementById("f_staff_list"), inp=document.getElementById("f_staff_q"); if(box) box.hidden=true; if(inp){ inp.setAttribute("aria-expanded","false"); inp.removeAttribute("aria-activedescendant"); } }
function spPick(id){

const shortName = n => String(n||"").replace(/^(นางสาว|นาย|นาง|น\.ส\.)\s*/,"").trim().split(/\s+/)[0] || "-";
const halfTxt = l => l.half&&l.half!=="full" ? (l.half==="am"?"ครึ่งเช้า":"ครึ่งบ่าย") : "";
function calMonthData(ym, kindOverride){
  const [y,m]=ym.split("-").map(Number), dim=new Date(Date.UTC(y,m,0)).getUTCDate();
  const from=`${ym}-01`, to=`${ym}-${String(dim).padStart(2,"0")}`, kf=kindOverride||S.calKind||"all", gf=S.calGroup||"";
  const byDay=new Map(), list=[];
  for(const p of staffList()){
    if(gf && groupOf(p)!==gf) continue;
    for(const l of p.leaves||[]){
      if(kf!=="all" && l.kind!==kf) continue;
      if(l.end<from || l.start>to) continue;
      let ds=leaveWorkDates(l); if(!ds.length) ds=[l.start];
      const inMonth=ds.filter(d=>d>=from && d<=to); if(!inMonth.length) continue;
      // วันลาที่ตกในเดือนนี้: ทั้งรายการอยู่ในเดือน = ตามที่บันทึก (รวมครึ่งวัน) · คร่อมเดือน = นับวันทำการในเดือน
      const mdays = inMonth.length===ds.length ? Number(l.days||0) : Math.min(inMonth.length, Number(l.days||0));
      list.push({l,p,inMonth:inMonth.length,mdays});
      for(const d of inMonth){ if(!byDay.has(d)) byDay.set(d,[]); byDay.get(d).push({l,p}); }
    }
  }
  list.sort((a,b)=>a.l.start.localeCompare(b.l.start)||(a.p.name||"").localeCompare(b.p.name||"","th"));
  return {y,m,dim,from,to,byDay,list};
}

// สรุปการลาแต่ละประเภทของเดือน (ไม่ขึ้นกับตัวกรองประเภท เพื่อเทียบกันได้ครบ)
function calSummary(ym){
  const A=calMonthData(ym,"all"), z=()=>({people:new Set(), n:0, days:0, emerg:0});
  const by={sick:z(), personal:z(), vacation:z(), all:z()}, per=new Map();
  for(const x of A.list){
    for(const k of [x.l.kind,"all"]){ const b=by[k]; if(!b) continue; b.people.add(x.p._id); b.n++; b.days+=x.mdays; if(x.l.emergency) b.emerg++; }
    if(!per.has(x.p._id)) per.set(x.p._id,{p:x.p, sick:0, personal:0, vacation:0, emerg:0, n:0});
    const r=per.get(x.p._id); if(r[x.l.kind]!==undefined) r[x.l.kind]+=x.mdays; if(x.l.emergency) r.emerg++; r.n++;
  }
  const rows=[...per.values()].map(r=>({...r,total:r.sick+r.personal+r.vacation}))
    .sort((a,b)=>b.total-a.total||(a.p.name||"").localeCompare(b.p.name||"","th"));
  return {by, rows};
}

  const cell=v=>v?`<td class="num">${fmtN(v)}</td>`:`<td class="num muted">-</td>`;
  const tot=rows.reduce((a,r)=>({sick:a.sick+r.sick,personal:a.personal+r.personal,vacation:a.vacation+r.vacation,total:a.total+r.total}),{sick:0,personal:0,vacation:0,total:0});

    ${rows.map(r=>`<tr><td><button class="linklike" data-act="person" data-id="${esc(r.p._id)}">${esc(r.p.name)}</button></td><td><small>${esc(groupOf(r.p)||"-")}</small></td>${cell(r.sick)}<td class="num">${r.personal?fmtN(r.personal)+(r.emerg?` <small class="muted">(ฉุกเฉิน ${r.emerg})</small>`:""):'<span class="muted">-</span>'}</td>${cell(r.vacation)}<td class="num"><b>${fmtN(r.total)}</b></td><td class="num">${r.n}</td></tr>`).join("")}
    <tr class="lc-total"><td colspan="2"><b>รวม</b></td><td class="num"><b>${fmtN(tot.sick)}</b></td><td class="num"><b>${fmtN(tot.personal)}</b></td><td class="num"><b>${fmtN(tot.vacation)}</b></td><td class="num"><b>${fmtN(tot.total)}</b></td><td class="num"><b>${rows.reduce((a,r)=>a+r.n,0)}</b></td></tr>
  </tbody></table></div>`:`<p class="muted">ไม่มีการลาในเดือนนี้</p>`}</details>`;

  else if(a==="cancel-del"){ S.delStaff=null; render(); }
  else if(a==="overlay"){ if(ev.target===t && !ev.target.closest(".cal")){ if(S.pwModal) S.pwModal=null; else if(S.delStaff) S.delStaff=null; else if(S.resetFor) S.resetFor=null; else S.editStaff=null; render(); } }
  else if(a==="edit-staff"){ const p=S.staff.get(id); S.editStaff={id,name:p.name||"",position:p.position||"",level:p.level||"",group:groupOf(p),section:p.section||"",ptype:p.ptype||"gov",role:p.role||"บุคลากร",cid:""}; render(); document.getElementById("s_name")?.focus(); }
  else if(a==="cancel-staff"){ S.editStaff=null; render(); }
  else if(a==="del-staff"){ const nm=S.staff.get(id)?.name||""; S.delStaff=null; if(S.editStaff?.id===id) S.editStaff=null; if(S.personId===id && S.view==="person") S.view="summary"; render();
    try{ await call("deleteStaff", id); toast(`ลบ ${nm} แล้ว`); }catch(e){} }
  else if(a==="edit-type"){ S.editType=id; S.typeDraft={...S.config.types[id]}; render(); document.getElementById("tcfg_0")?.focus(); }
  else if(a==="cancel-type"){ S.editType=null; S.typeDraft=null; render(); }
  else if(a==="save-type"){
    captureTypeForm();
    const types = JSON.parse(JSON.stringify(S.config.types)), d = S.typeDraft||{};
    for(const f of ["sick","personal","vacation","carryCap"]){
      const v = String(d[f] ?? "").trim(), n = Number(v);
      if(v==="" || !Number.isFinite(n) || n<0){ toast("กรุณากรอกจำนวนวันเป็นตัวเลขตั้งแต่ 0 ขึ้นไป"); document.querySelector(`[data-cfg="${id}.${f}"]`)?.focus(); return; }
      types[id][f] = n;
    }
    try{ await call("saveTypes", types, S.config.startFY); S.editType=null; S.typeDraft=null; render(); toast(`บันทึกสิทธิ์การลา ${types[id].label} แล้ว`); }catch(e){}
  }
  else if(a==="save-cfg"){
    const startFY = Number(document.getElementById("cfg_start").value)||S.config.startFY;
    try{ await call("saveTypes", S.config.types, startFY); toast("บันทึกปีงบประมาณแล้ว"); }catch(e){}
  }
  else if(a==="del-hol"){ try{ await call("deleteHoliday", t.dataset.d); toast("ลบวันหยุดแล้ว"); }catch(e){} }
  else if(a==="csv"){ exportCsv(); }
});
document.addEventListener("focusin", ev => { if(ev.target.id==="f_staff_q" && !SP.quiet){ SP.idx=0; ev.target.select(); spOpen(""); } });
document.addEventListener("focusout", ev => {
  if(ev.target.id!=="f_staff_q") return;
  setTimeout(()=>{ const inp=document.getElementById("f_staff_q"); if(!inp || document.activeElement===inp) return; spClose();
    const cur=S.draft&&S.draft.staffId ? S.staff.get(S.draft.staffId) : null;
    if(!inp.value.trim() && cur) spPick(""); else inp.value = cur ? cur.name : ""; }, 150);
});
document.addEventListener("mousedown", ev => { if(ev.target.id==="f_staff_q" && document.activeElement===ev.target && document.getElementById("f_staff_list")?.hidden){ SP.idx=0; spOpen(""); }
  const li=ev.target.closest&&ev.target.closest("#f_staff_list li[data-sp]"); if(li){ ev.preventDefault(); spPick(li.dataset.sp); } });
document.addEventListener("keydown", ev => {
  if(ev.target.id==="f_staff_q"){
    const box=document.getElementById("f_staff_list"); const open=box&&!box.hidden;
    if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){ ev.preventDefault(); if(!open){ spOpen(ev.target.value); return; } if(!SP.items.length) return;
      SP.idx=(SP.idx+(ev.key==="ArrowDown"?1:-1)+SP.items.length)%SP.items.length; spOpen(ev.target.value); return; }
    if(ev.key==="Enter"){ ev.preventDefault(); if(open && SP.items[SP.idx]) spPick(SP.items[SP.idx]._id); return; }
    if(ev.key==="Escape" && open){ ev.preventDefault(); ev.stopPropagation(); spClose(); return; }
  }
 if(ev.key==="Escape" && S.tdp){ S.tdp=null; render(); return; } if(ev.key==="Escape" && (S.delStaff||S.editStaff||S.resetFor||S.pwModal)){ if(S.pwModal) S.pwModal=null; else if(S.delStaff) S.delStaff=null; else if(S.resetFor) S.resetFor=null; else S.editStaff=null; render(); return; } if(ev.key==="Enter" && ev.target.matches("tr[data-act]")) ev.target.click(); });
$fy.addEventListener("change", () => { S.fy = Number($fy.value); render(); });

function readDraft(){
  const d = S.draft; if(!d) return;
  const g = id => document.getElementById(id);
  if(g("f_staff")) d.staffId = g("f_staff").value;
  const k = document.querySelector('input[name="f_kind"]:checked'); if(k) d.kind = k.value;
  if(g("f_start")) d.start = g("f_start").value;
  if(g("f_end")) d.end = g("f_end").value;
  if(d.end < d.start) d.end = d.start;
  if(g("f_half")) d.half = d.start===d.end ? g("f_half").value : "full";
  d.emergency = d.kind==="personal" && !!g("f_emerg")?.checked;
  if(g("f_days")) d.daysOverride = g("f_days").value;
  if(g("f_note")) d.note = g("f_note").value;
  if(g("f_doc")) d.docNo = g("f_doc").value;
}
function refreshCalc(){
  const box=document.getElementById("calcBox"); if(!box) return;
  if(document.getElementById("f_end")?.value!==S.draft.end) setDateValue("f_end", S.draft.end);
  const t=document.createElement("template"); t.innerHTML=viewRecord(); const c=t.content;
  box.innerHTML=c.getElementById("calcBox")?.innerHTML||"";
  for(const id of ["f_half_lbl","f_days_lbl"]){ const a=document.getElementById(id), b=c.getElementById(id); if(a&&b) a.textContent=b.textContent; }
  const dy=document.getElementById("f_days"), ndy=c.getElementById("f_days"); if(dy&&ndy) dy.placeholder=ndy.placeholder;
  const hf=document.getElementById("f_half"), nhf=c.getElementById("f_half"); if(hf&&nhf){ hf.disabled=nhf.disabled; hf.value=S.draft.half; }
}
function captureTypeForm(){
  if(!S.editType || !S.typeDraft) return;
  document.querySelectorAll("[data-cfg]").forEach(inp=>{ const [k,f]=inp.dataset.cfg.split("."); if(k===S.editType) S.typeDraft[f]=inp.value; });
}
function captureStaffForm(){
  const e=S.editStaff; if(!e) return; const g=id=>document.getElementById(id);
  if(g("s_name")) e.name=g("s_name").value; if(g("s_pos")) e.position=g("s_pos").value; if(g("s_level")) e.level=g("s_level").value; if(g("s_group")) e.group=g("s_group").value; if(g("s_section") && !g("s_section").disabled) e.section=g("s_section").value; else if(g("s_section")) e.section="";
  if(g("s_type")) e.ptype=g("s_type").value; if(g("s_role")) e.role=g("s_role").value; if(g("s_cid")) e.cid=g("s_cid").value;
}
document.addEventListener("change", ev => {
  const id = ev.target.id || ev.target.name;
  if(id==="f_staff_q") return; // ช่องค้นหาบุคลากร จัดการเองใน spOpen/spPick
  if(id==="cal_kind"){ S.calKind=ev.target.value; render(); return; }
  if(id==="cal_group"){ S.calGroup=ev.target.value; render(); return; }
  if(S.view==="record" && /^f_/.test(id)){
    readDraft();
    if(["f_start_txt","f_end_txt","f_half","f_kind","f_staff","f_emerg"].includes(id)){ S.draft.daysOverride=""; const fd=document.getElementById("f_days"); if(fd) fd.value=""; }
    // text fields: patch in place, a full re-render here would swallow a click on the save button
    if(["f_start_txt","f_end_txt","f_note","f_doc","f_days"].includes(id)) refreshCalc(); else render();
  }
  if(id==="pageSize"){ S.pageSize=Number(ev.target.value)||10; try{ localStorage.setItem("leave.pageSize", S.pageSize); }catch(e){} resetPages(); render(); }
  if(id==="ftype"){ S.filterType=ev.target.value; resetPages(); render(); }
  if(id==="fgroup"){ S.filterGroup=ev.target.value; resetPages(); render(); }
  if(id==="sgroup"){ S.sGroup=ev.target.value; resetPages(); render(); }
  if(id==="astatus"){ S.aStatus=ev.target.value; resetPages(); render(); }
  if(id==="cxl_from"||id==="cxl_to"){ cxlUpdate(); return; }
  if(id==="cxstaff"){ S.cxStaff=ev.target.value; S.confirmKey=null; resetPages(); render(); }
  if(id==="s_group"){ captureStaffForm(); if(!sectionsOf(S.editStaff.group).includes(S.editStaff.section)) S.editStaff.section=""; render(); }
});
document.addEventListener("change", ev => {
  const t=ev.target;
  if(t.id && t.id.endsWith("_txt") && t.closest(".tdp")){
    const id=t.id.slice(0,-4); const v=t.value.trim();
    if(!v){ setDateValue(id,""); return; }
    const iso=beToIso(v);
    if(!iso){ toast("รูปแบบวันที่ไม่ถูกต้อง ใช้ วว/ดด/ปปปป เป็น พ.ศ. เช่น 05/10/2569"); ev.stopImmediatePropagation(); setDateValue(id, document.getElementById(id)?.value||""); return; }
    setDateValue(id, iso);
  }
  if(t.id==="tdp_m" || t.id==="tdp_y"){ ev.stopImmediatePropagation(); S.tdp.m=+document.getElementById("tdp_m").value; S.tdp.y=+document.getElementById("tdp_y").value; render(); }
}, true);
let searchT;
document.addEventListener("input", ev => {
  const id = ev.target.id;
  if(id==="q"){ S.q=ev.target.value; resetPages(); render(); }
  else if(id==="sq"){ S.sq=ev.target.value; resetPages(); render(); }
  else if(id==="aq"){ S.aq=ev.target.value; resetPages(); render(); }
  else if(id==="cxq"){ S.cxQ=ev.target.value; resetPages(); render(); }
  else if(id==="lg_user"){ S.lgUser=ev.target.value; }
  else if(id==="f_staff_q"){ SP.idx=0; spOpen(ev.target.value); }
  else if(id==="h_n"){ S.hn=ev.target.value; }
  else if(S.view==="record" && (id==="f_note"||id==="f_doc"||id==="f_days")){ readDraft(); if(id==="f_days") refreshCalc(); }

});

document.addEventListener("submit", async ev => {
  ev.preventDefault();
  const f = ev.target;
  if(f.id==="cxlForm"){
    const reason=(document.getElementById("cxl_reason")?.value||"").trim();
    if(!reason){ toast("กรุณาระบุเหตุผลการยกเลิก"); return; }
    const r=cxlRead(); if(!r) return;
    if(r.to<r.from){ toast("วันที่ถึง ต้องไม่ก่อนวันที่ตั้งแต่"); return; }
    if(!r.whole && !(cxlDays(r.l, r.from, r.to)>0)){ toast("ช่วงวันที่เลือกไม่มีวันทำการให้ยกเลิก"); return; }
    S.confirmKey=null;
    try{ if(r.whole) await call("cancelLeave", f.dataset.id, reason); else await call("cancelLeave", f.dataset.id, reason, r.from, r.to);
      toast(r.whole?"ยกเลิกวันลาแล้ว วันที่ยกเลิกไม่นับเป็นวันลา":`ยกเลิก ${thDate(r.from)}${r.from!==r.to?" – "+thDate(r.to):""} แล้ว วันที่เหลือยังนับเป็นวันลา`); }catch(e){}
    return;
  }
  if(f.id==="leaveForm"){
    readDraft(); const d=S.draft;
    if(!d.staffId){ toast("เลือกบุคลากรก่อน"); return; }
    if(!d.start||!d.end){ toast("ระบุวันที่ลา"); return; }
    const p = S.staff.get(d.staffId); if(!p) return;
    const days = d.daysOverride!=="" ? Number(d.daysOverride) : workingDays(d.start,d.end,d.half);
    if(!(days>0)){ toast("จำนวนวันทำการเป็น 0 ตรวจสอบวันที่หรือวันหยุด"); return; }
    try{ await call("addLeave", {staffId:d.staffId, kind:d.kind, start:d.start, end:d.end, half:d.start===d.end?d.half:"full", days, emergency:!!d.emergency, note:d.note.trim(), docNo:d.docNo.trim()});
      toast(`บันทึก${KINDS[d.kind].label}ของ ${p.name} ${fmtN(days)} วันแล้ว`);
      S.draft={...d, note:"", docNo:"", daysOverride:"", emergency:false}; render(); }
    catch(e){}
  }
  else if(f.id==="staffForm"){
    captureStaffForm(); const e=S.editStaff;
    if(!e.name.trim()){ toast("กรอกชื่อ-สกุล"); return; }
    const cid=(e.cid||"").replace(/\D/g,"");
    if(cid && cid.length!==13){ toast("เลขบัตรประชาชนต้องมี 13 หลัก"); return; }
    try{
      await call("saveStaff", {id:e.id, name:e.name.trim(), position:e.position.trim(), level:e.level||"", group:e.group.trim(), section:e.section.trim(), ptype:e.ptype, role:e.role, cid});
      toast(e.id?"บันทึกข้อมูลบุคลากรแล้ว":"เพิ่มบุคลากรแล้ว"); S.editStaff=null; render();
    }catch(err){}
  }
  else if(f.id==="loginForm"){
    const u=document.getElementById("lg_user").value.trim(), pw=document.getElementById("lg_pw").value;
    if(!u||!pw) return;
    S.busy=true; render();
    try{
      const r = await gas("login", [u, pw]);
      S.token=r.token; saveToken(r.token); applyData(r.data); S.view="summary";
      if(r.mustChange) S.pwModal={first:true};
      S.busy=false; render(); toast("ยินดีต้อนรับ "+(S.me?.name||""));
    }catch(e){ S.busy=false; render(); toast(String(e.message||e).replace(/^Error:\s*/,"")); document.getElementById("lg_pw")?.focus(); }
  }
  else if(f.id==="pwForm"){
    const o=document.getElementById("p_old").value, n1=document.getElementById("p_new").value, n2=document.getElementById("p_new2").value;
    if(n1!==n2){ toast("รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน"); return; }
    try{ await call("changePassword", o, n1); S.pwModal=null; render(); toast("เปลี่ยนรหัสผ่านแล้ว"); }catch(e){}
  }
  else if(f.id==="resetForm"){
    const cid=document.getElementById("r_cid").value.replace(/\D/g,"");
    if(cid && cid.length!==13){ toast("เลขบัตรประชาชนต้องมี 13 หลัก"); return; }
    const nm=S.staff.get(S.resetFor)?.name||"";
    try{ await call("resetPassword", S.resetFor, cid); S.resetFor=null; render(); toast(`รีเซ็ตรหัสผ่านของ ${nm} แล้ว`); }catch(e){}
  }
  else if(f.id==="holForm"){
    const d=document.getElementById("h_d").value, n=document.getElementById("h_n").value.trim(); if(!d){ toast("ระบุวันที่วันหยุด"); return; } if(!n){ toast("ระบุชื่อวันหยุด"); return; }
    S.hd=""; S.hn="";
    try{ await call("addHoliday", d, n); toast("เพิ่มวันหยุดแล้ว"); }catch(e){}
  }
});

async function exportCsv(){
  const K=[["sick","ลาป่วย"],["personal","ลากิจ"],["vacation","ลาพักผ่อน"]];
  const rows=[["ปีงบประมาณ","ชื่อ-สกุล","ตำแหน่ง","ระดับ","กลุ่มงาน","งาน","ประเภท",
    ...K.flatMap(([,l])=>[`${l}:สิทธิ์ประจำปี`,`${l}:สะสมยกมา`,`${l}:รวมสิทธิ์`,`${l}:ลาปีนี้(ครั้ง)`,`${l}:ลาปีนี้(วัน)`,`${l}:คงเหลือ`,`${l}:ลาสะสมทุกปี(วัน)`]),"ลากิจฉุกเฉินปีนี้(ครั้ง)"]];
  for(const p of staffList()){ const b=balances(p,S.fy);
    rows.push([S.fy,p.name,p.position||"",p.level||"",groupOf(p),p.section||"",typeCfg(p).label,
      ...K.flatMap(([k])=>[b[k].annual,b[k].carry,b[k].quota,b[k].count,b[k].used,b[k].left,b[k].cum]),b.personal.emergency]); }
  try{ const r = await call("exportSheet", `สรุปวันลา ปีงบ ${S.fy}`, rows);
    toast(`ส่งออกแล้ว: ชีต "${r.sheet}" ในไฟล์ Google Sheets ของระบบ`); }catch(e){}
}

// ---------- boot ----------
(async function boot(){
  let t=null; try{ t=sessionStorage.getItem("leave.token"); }catch(e){}
  if(t){
    S.token=t; $app.innerHTML=`<div class="panel empty"><h3>กำลังโหลดข้อมูล…</h3></div>`;
    try{ const r=await gas("bootstrap",[t]); applyData(r.data); }catch(e){ S.token=null; saveToken(null); }
  }
  render();
})();
})();
